<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ariannette S. Omawas — BSIT Student</title>

  <style>
    :root {
      --bg: #1c1917;
      --card: #292524;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --text: #f5f5f4;
      --muted: #a8a29e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1c1917 0%, #292524 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      max-width: 540px;
      width: 100%;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(168, 162, 158, 0.1);
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #fb923c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.25rem;
    }

    .role {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .role::before {
      content: "📍 ";
    }

    .bio {
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 0.9rem;
    }

    .skills {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .skills li {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid rgba(249, 115, 22, 0.25);
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #1c1917;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .github-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);
    }

    .github-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    /* Change the appearance of all links */
    a {
      color: #fed7aa;
      text-decoration: none;
    }

    /* When your mouse is over the link */
    a:hover {
      color: #fb923c;
      text-decoration: underline;
    }

    /* When the link has been visited */
    a:visited {
      color: #fed7aa;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">AO</div>

    <h1>Ariannette S. Omawas</h1>

    <p class="role">BSIT Student · Philippines</p>

    <p class="bio">
      CONTACTS:
    </p>

    <p>
      Email:
      <a class="link" href="mailto:ariannetteomawas23@gmail.com">
        ariannetteomawas23@gmail.com
      </a>
    </p>

    <p>Contact No.: 09279926846</p>

    <p>
      Facebook:
      <a class="link" href="https://www.facebook.com/ariannette.omawas.5/">
        Ariannette Solante Omawas
      </a>
    </p>

  </main>
</body>
</html>
