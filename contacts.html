<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ariannette S. Omawas — BSIT Student</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      max-width: 540px;
      width: 100%;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.25rem;
    }

    .role {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .role::before {
      content: "📍 ";
    }

    .bio {
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 0.9rem;
    }

    .skills {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .skills li {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .github-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }

    .github-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

  /* Change the appearance of all links */
a {
    color: #ffffff;          /* Text color */
    text-decoration: none;   /* Removes the underline */
}

/* When your mouse is over the link */
a:hover {
    color: #007BFF;
    text-decoration: underline;
}

/* When the link has been visited */
a:visited {
    color: #333333;
}
  </style>
</head>
<body>
